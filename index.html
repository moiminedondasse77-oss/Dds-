<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boutique en ligne — Commande WhatsApp</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #14181f;
      --muted: #5c6675;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --whatsapp: #16a34a;
      --danger: #dc2626;
      --border: #e5e7eb;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 84px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .topbar {
      max-width: 1080px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: 0.15s ease;
    }

    button:hover {
      background: #f3f4f6;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .btn-wa {
      background: var(--whatsapp);
      color: #fff;
      border-color: var(--whatsapp);
    }

    .btn-danger {
      background: #fef2f2;
      color: var(--danger);
      border-color: #fecaca;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-input, .field-input, .field-textarea, .field-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 0.95rem;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .cat-btn {
      white-space: nowrap;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.84rem;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-img-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #eef2f6;
      overflow: hidden;
      position: relative;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-rupture {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(220, 38, 38, 0.92);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-cat {
      font-size: 0.74rem;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
    }

    .card-desc {
      font-size: 0.83rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-price {
      font-size: 1.02rem;
      font-weight: 800;
      margin-top: auto;
      padding-top: 6px;
    }

    .card-actions {
      padding: 0 12px 12px;
      display: flex;
      gap: 8px;
    }

    .card-actions button {
      flex: 1;
      padding: 8px;
      font-size: 0.82rem;
    }

    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      z-index: 25;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06);
    }

    .cart-bar-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 40;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: var(--radius);
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px;
      border: 1px solid var(--border);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .admin-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .toast {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      z-index: 60;
      display: none;
    }

    .toast.show {
      display: block;
    }

    footer {
      max-width: 1080px;
      margin: 24px auto 12px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <span class="brand-title" id="shopNameDisplay">Ma Boutique</span>
        <span
